{% set name = "powergenome" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a64f6b5d2877b1c9b4f94e84902df8c92981a61a15999d51d611ad0e7beeecc7

build:
  entry_points:
    - run_powergenome_multiple = powergenome.run_powergenome_multiple_outputs_cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools >=66,<68
    - wheel
    - pip
  run:
    - python >=3.8
    - catalystcoop.pudl >=0.6.0,<=2022.11.30
    - beautifulsoup4 >=4.8.13
    - statsmodels >=0.12.2
    - python-dotenv
    - flatten-dict
    - ruamel.yaml
    - pyyaml
    - frozendict
    - openpyxl >=3.0
    - geopandas >=0.11

test:
  imports:
    - powergenome
  commands:
    - pip check
    - run_powergenome_multiple --help
  requires:
    - pip

about:
  home: https://github.com/PowerGenome/PowerGenome
  summary: Create power system inputs for capacity expansion models
  dev_url: https://github.com/PowerGenome/PowerGenome
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - gschivley
